- id: move
  title: { en: The Move to Córdoba, es: La Mudanza a Córdoba }
  text:
    en: Moved to Córdoba to study Computer Engineering. A small-town girl in a big city where I knew no one, at 18.
    es: Me mudé a Córdoba para estudiar Ingeniería en Computación. De un pueblo chico a una ciudad grande donde no conocía a nadie, a los 18.
  image: /assets/img/life/cordoba.webp
  alt: Córdoba Cathedral with an AMO CBA sign
  date: 2021

- id: baby
  title: { en: Baby Engineer Era, es: Era de Bebé Ingeniera }
  text:
    en: I wasn't born in front of a computer, but I was pretty close. Here with my brother.
    es: No nací frente a una compu, pero estuve cerca. Acá con mi hermano.
  image: /assets/img/life/baby-me.jpg
  alt: Baby MaVi with her brother at the computer, 2003
  date: 2003

