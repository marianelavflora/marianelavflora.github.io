# Projects & achievements: the cards on the 02 Journey timeline (and the ones
# marked `featured` also in 03 Featured projects).
# One entry per card. The page sorts them newest first by `date`, so the
# order here doesn't matter (cards with the same month keep this order).
#
# Fields:
#   date       YYYY-MM, shown as "Sep 2026" on the timeline
#   hidden     true = keep the entry but don't show it yet
#   featured   optional position (1, 2, 3...) in 03 Featured projects; the card
#              still shows on the timeline too
#   type       hackathon | gamejam | robot | opensource (sets the tag colour)
#   typeLabel  optional custom text for the type tag (e.g. "GameJam #2")
#   status     optional second tag: kind is win | soon | org | wip
#   tech       optional list of languages/frameworks used, shown as pills
#   event      the event: title, text, meta, and its photo (image + alt) or an emoji
#   product    what came out of it: label is product | role | outcome, plus
#              title, text, links and its own photo (image + alt) or an emoji
#
# Each card shows both photos and swaps between them every few seconds;
# clicking a photo opens it big. A missing photo is just left out, and a card
# with no photos shows only its text.
#
# Any text can be one string (same in both languages) or { en, es }.

